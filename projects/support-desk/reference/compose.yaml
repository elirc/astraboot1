services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training-local-only
      POSTGRES_DB: support_desk
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - training-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d support_desk"]
      interval: 5s
      retries: 10
volumes:
  training-data:
