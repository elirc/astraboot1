services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: devpractice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpractice_local}
      POSTGRES_DB: devpractice
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpractice"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
